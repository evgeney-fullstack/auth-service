version: "3.8"
services:
  auth-service-db:
    image: postgres:15-alpine
    container_name: auth-service-postgres
    environment:
      - POSTGRES_USER=auth_service_user
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=auth_service_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U auth_service_user -d auth_service_db -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-service-network

networks:
  auth-service-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
